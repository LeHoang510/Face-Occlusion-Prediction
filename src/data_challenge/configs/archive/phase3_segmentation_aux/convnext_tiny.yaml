project_name: data-challenge-occlusion
run_name: phase3_seg_aux_convnext_tiny

data:
  train_csv: dataset/DataChallenge2026/occlusion_datasets/train.csv
  test_csv: dataset/DataChallenge2026/occlusion_datasets/test_students.csv
  img_root: dataset/crops/Crop_224_5fp_100K
  val_split: 0.1
  img_size: 224
  num_workers: 4

segmentation:
  mask_root: dataset/masks/sam_vit_b

model:
  backbone: convnext_tiny
  pretrained: true
  dropout: 0.3
  mask_feature_dim: 64
  hidden_dim: 256
  freeze_backbone: true

training:
  epochs: 20
  batch_size: 32
  learning_rate: 1.0e-4
  weight_decay: 1.0e-4
  scheduler: cosine
  warmup_epochs: 3
  seed: 42
  gradient_clip: 1.0
  batching:
    strategy: balanced_gender
    drop_last: false

wandb:
  enabled: true
  project: data-challenge-occlusion
  entity: null

output:
  dir: outputs
